<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>GFU DASH Collector</title>
    <style>
      body {
        width: 380px;
        margin: 0;
        padding: 14px;
        font-family: Arial, sans-serif;
        color: #1f2328;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 16px;
      }
      label {
        display: grid;
        gap: 4px;
        margin: 8px 0;
        font-size: 12px;
        font-weight: 700;
      }
      input, textarea {
        box-sizing: border-box;
        width: 100%;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        padding: 8px;
        font-size: 12px;
      }
      textarea {
        height: 88px;
        resize: vertical;
        font-family: Consolas, monospace;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      button {
        flex: 1;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        background: #f6f8fa;
        padding: 9px;
        font-weight: 700;
        cursor: pointer;
      }
      button.primary {
        border-color: #1f6feb;
        background: #1f6feb;
        color: white;
      }
      pre {
        white-space: pre-wrap;
        border-radius: 6px;
        background: #f6f8fa;
        padding: 8px;
        min-height: 42px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>GFU DASH SingleONE Collector</h1>
    <label>
      GFU DASH 설정 JSON
      <textarea id="configJson" placeholder="GFU DASH의 싱글원 수집기 설정 JSON을 붙여넣으세요."></textarea>
    </label>
    <label>
      행 선택자
      <input id="rowSelector" placeholder="비워두면 자동 탐색" />
    </label>
    <label>
      캠페인/광고그룹/소재/이미지 선택자 JSON
      <input id="fieldSelectors" placeholder='예: {"campaignName":".campaign","adName":".creative","image":"img"}' />
    </label>
    <div class="row">
      <button id="save">설정 저장</button>
      <button id="send" class="primary">현재 페이지 수집 및 전송</button>
    </div>
    <pre id="status">대기 중</pre>
    <script src="popup.js"></script>
  </body>
</html>
